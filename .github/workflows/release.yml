name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.3.0-rc.1
        required: true
        type: string
      confirm_config_changes:
        description: Confirm reviewed release configuration changes
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.tag }}
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag }}
      MIX_ENV: prod
    steps:
      - name: Check out ${{ inputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up BEAM for ${{ inputs.tag }}
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.19.5
          otp-version: 28.1.1

      - name: Set up Zig for ${{ inputs.tag }}
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64)
              zig_archive="zig-aarch64-macos-0.16.0.tar.xz"
              zig_sha256="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
              ;;
            x86_64)
              zig_archive="zig-x86_64-macos-0.16.0.tar.xz"
              zig_sha256="0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7"
              ;;
            *)
              echo "Unsupported macOS runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          zig_url="https://ziglang.org/download/0.16.0/${zig_archive}"
          zig_download="${RUNNER_TEMP}/${zig_archive}"
          zig_install_dir="${RUNNER_TEMP}/zig-0.16.0"

          curl --proto '=https' --tlsv1.2 -fsSL --output "${zig_download}" "${zig_url}"
          printf '%s  %s\n' "${zig_sha256}" "${zig_download}" | shasum -a 256 -c -
          mkdir -p "${zig_install_dir}"
          tar -xJf "${zig_download}" -C "${zig_install_dir}" --strip-components=1
          printf '%s\n' "${zig_install_dir}" >> "${GITHUB_PATH}"
          "${zig_install_dir}/zig" version

      - name: Validate ${{ inputs.tag }}
        shell: bash
        env:
          CONFIG_CHANGES_CONFIRMED: ${{ inputs.confirm_config_changes }}
        run: scripts/release.sh validate

      - name: Test ${{ inputs.tag }}
        shell: bash
        env:
          MIX_ENV: test
        run: |
          mix deps.get
          mix test

      - name: Build ${{ inputs.tag }} executables
        shell: bash
        run: scripts/release.sh build

      - name: Publish ${{ inputs.tag }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh publish

      - name: Publish Hex package for ${{ inputs.tag }}
        shell: bash
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          MIX_ENV: dev
        run: |
          mix deps.get
          mix hex.publish --yes
